org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
# 本机 PATH 上的 java 是 32 位 JRE 8（无法保留 2GB 堆，会静默杀掉守护进程）。
# 写死 JDK 17，不再依赖 JAVA_HOME 是否传递到子进程。
org.gradle.java.home=<LOCAL_TOOLS>/jdk/jdk-17
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
# 必须为 true（P5 真机冒烟实测结论）。
# pdfium-android:1.9.0 的 com.shockwave.pdfium.PdfDocument 在构造时 new 了
# android.support.v4.util.ArrayMap；该库的 POM 又声明了 com.android.support:support-v4，
# 而我们在依赖里把 com.android.support 整个排除了（避免与 AndroidX 重复类）。
# 结果：编译期无感、JVM 单测无感（单测不走 pdfium native），真机上打开任何 PDF 直接
#   NoClassDefFoundError: android.support.v4.util.ArrayMap  ->  PdfRenderView open failed
# 开 Jetifier 后，PdfDocument 的这条引用会被改写成 androidx.collection.ArrayMap（本就随
# androidx.core 存在），既不需要把 26.1.0 的老 support 库塞回来（约 1.4MB dex），
# 又让渲染链路可用。
android.enableJetifier=true
kotlin.code.style=official
