<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>ReadIt</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            color: #000000;
            overflow: hidden;
        }

        #viewer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        /*
          ReadIt 内置打包字体（OFL，见 tools/gen_packaged_fonts.py）。
          页面本身是 file:///android_asset/readit_epub/reader.html，与 fonts/ 同属 android_asset，
          所以 ../fonts/... 能直接加载（DOCX 那边的 WebView 禁了 file 访问，故只在这里声明）。
          @font-face 是懒加载的：不选中这两款字体就不会去读文件，不占内存。
        */
        @font-face {
            font-family: 'ReadIt Serif SC';
            src: url('../fonts/readit_font_notoserif_sc.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'ReadIt WenKai';
            src: url('../fonts/readit_font_lxgw_wenkai.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* E-Ink：禁用全部动画 / 过渡 / 阴影，避免残影与灰阶抖动 */
        *, *:before, *:after {
            -webkit-transition: none !important;
            transition: none !important;
            -webkit-animation: none !important;
            animation: none !important;
            text-shadow: none !important;
            box-shadow: none !important;
        }
    </style>
    <!--
      !! 加载顺序不能改 !!
      epub.js 0.3.88 的 dist/epub.min.js 是 UMD 构建，把 JSZip 当**外部依赖**：
        t.ePub = e(t.xmldom, t.JSZip)
      它在脚本**执行的那一刻**就从全局取一次 JSZip 并闭包捕获。
      所以 JSZip 必须先加载；事后注入无效，页面上会表现为
      ePub(url) 能建出 Book，但 book.ready 既不 resolve 也不 reject —— 永久白屏、无报错。
      （epub.js 要求 jszip ^3.4.0；随包附带的 libs/jszip 是 2.x，实例上没有 loadAsync，不能用。）
      本目录下的 jszip.min.js 为 JSZip v3.10.1（MIT / GPLv3）。
    -->
    <script src="jszip.min.js"></script>
    <script src="epub.min.js"></script>
</head>
<body>
<div id="viewer"></div>
<script>
    (function () {
        var book = null;
        var rendition = null;
        /*
         * 单次渲染计时起点。
         * 每次导航（open / display / displayCfi / next / prev）前都要重置，
         * 否则后续重渲染会把「从打开本书到现在的总时长」当成渲染耗时上报
         * （曾观测到 34s / 68s / 72s 这类假数字，会污染验收报告里的性能数据）。
         */
        var renderStart = 0;
        var startCfi = "";
        /* 反色（黑白置换，F27）。epub.js 的正文在 iframe 里，
           所以正文靠 rendition.themes.override，画布外圈靠 html/body 的底色。*/
        var inverted = false;

        /* 字号百分比（100 = 不变）。见 applyFontSize()。 */
        var fontPct = 100;

        function fire(name, args) {
            try {
                var o = window.ReadItBridge;
                if (o && typeof o[name] === "function") {
                    o[name].apply(o, args);
                }
            } catch (e) {
                /* 桥不可用时静默降级，避免污染页面 */
            }
        }

        function applyTheme() {
            var fg = inverted ? "#ffffff" : "#000000";
            var bg = inverted ? "#000000" : "#ffffff";
            try {
                document.documentElement.style.background = bg;
                document.body.style.background = bg;
            } catch (e) {
            }
            if (!rendition) {
                return;
            }
            try {
                rendition.themes.override("color", fg);
                rendition.themes.override("background", bg);
            } catch (e) {
            }
        }

        /*
         * 字号规格化注入：themes.fontSize 只在 body 上给一个百分比，走的是继承链——
         * 书内 CSS 若对 p/div/h1/span 直接声明了绝对 px 字号，子元素自己的声明永远压过继承，
         * 字号就「调不动」。产品承诺是「字号四格式全生效」，所以这里必须把**所有**带
         * font-size 声明的常见元素强制回继承链，根字号由 html 承担：html 收百分比，
         * 正文元素全部 inherit，一层缩放全局生效。
         *
         * 标题不进 inherit，而是给一条**固定 em 阶梯**（h1 1.8em … h6 1em）：
         *  - 全部 inherit 会把 h1~h6 压成与正文同大，作者靠字号表达的层级就没了；
         *  - 保留书内的 px 又会让滑条对标题完全失效（这正是原来的问题）。
         * em 相对父级、而父级已 inherit 自 html，所以阶梯随滑条一起缩放，层级也还在。
         * 代价是对齐了标题尺寸：某本书刻意用 2.4em 的 h1，改成 1.8em。这是有意的取舍，
         * 因为「滑条对标题无效」比「标题尺寸被归一」更伤。
         *
         * 每章都是新 iframe 文档，rendered 事件里必须重放。
         */
        var TEXT_SELECTORS = "body,div,p,li,dd,dt,blockquote,figcaption,td,th,span,a," +
            "em,strong,b,i,u,s,small,pre,code,label,caption,figcaption";

        function applyFontSize() {
            if (!rendition) {
                return;
            }
            var css = "html{font-size:" + fontPct + "% !important;}" +
                TEXT_SELECTORS + "{font-size:inherit !important;}" +
                "h1{font-size:1.8em !important;}" +
                "h2{font-size:1.5em !important;}" +
                "h3{font-size:1.3em !important;}" +
                "h4{font-size:1.15em !important;}" +
                "h5,h6{font-size:1em !important;}";
            var contents;
            try {
                contents = rendition.getContents();
            } catch (e) {
                return;
            }
            contents.forEach(function (c) {
                try {
                    var doc = c.document;
                    var s = doc.getElementById("readit-font-size");
                    if (!s) {
                        s = doc.createElement("style");
                        s.id = "readit-font-size";
                        (doc.head || doc.documentElement).appendChild(s);
                    }
                    s.textContent = css;
                } catch (e) {
                }
            });
        }

        function hookRendition(r) {
            r.on("rendered", function (section) {
                var href = "";
                try {
                    href = (section && section.href) ? section.href : "";
                } catch (e) {
                }
                fire("onRendered", [href, String(Date.now() - renderStart)]);
                applyFontSize();
            });
            r.on("relocated", function (loc) {
                if (!loc || !loc.start) {
                    return;
                }
                var d = loc.start.displayed || {};
                fire("onLocation", [
                    String(loc.start.cfi || ""),
                    String(loc.start.href || ""),
                    String(loc.start.index || 0),
                    String(d.page || 0),
                    String(d.total || 0)
                ]);
            });
            r.on("displayError", function (e) {
                fire("onError", ["displayError: " + (e && e.message ? e.message : e)]);
            });
        }

        window.ReadItEpub = {
            hasEngine: function () {
                return typeof window.ePub === "function";
            },

            open: function (url, cfi, fontPercent, fontFamily, invert) {
                renderStart = Date.now();
                startCfi = cfi || "";
                fontFamily = fontFamily || "sans-serif";
                inverted = !!invert;
                fontPct = fontPercent || 100;
                if (typeof window.ePub !== "function") {
                    fire("onError", ["epub.js not loaded"]);
                    return;
                }
                try {
                    book = ePub(url);
                } catch (e) {
                    fire("onError", ["init: " + (e && e.message ? e.message : e)]);
                    return;
                }
                book.ready.then(function () {
                    var el = document.getElementById("viewer");
                    rendition = book.renderTo(el, {
                        width: "100%",
                        height: "100%",
                        spread: "none",
                        flow: "paginated",
                        minSpreadWidth: 100000
                    });
                    try {
                        rendition.themes.fontSize(fontPercent + "%");
                        rendition.themes.override("font-family", fontFamily);
                    } catch (e) {
                    }
                    /* 正文字色/底色统一由 applyTheme 决定，避免反色状态两处维护 */
                    applyTheme();
                    hookRendition(rendition);
                    /* 0 为首个 linear spine 项；有进度时用 CFI */
                    var first = startCfi ? startCfi : 0;
                    return rendition.display(first).catch(function (err) {
                        /* 存档 CFI 失效（书被替换过、epub.js 改版、或偏移越界）时**不能就此白屏**：
                           原来这里只 fire 一个 onError，页面永远留白，而且
                           lastCfi 仍以存档值初始化、ProgressPolicy 又在 cfi 为空时才 Skip，
                           于是坏 CFI 既不会被覆盖也不会被清除 —— 用户每次打开这本都是白屏，
                           除非删书重导。回落第 0 章，并把 cfi 清空让上层重新落一个有效值。 */
                        fire("onError", ["display(cfi) failed, fallback to start: " +
                            (err && err.message ? err.message : err)]);
                        window.ReadItEpub.forgetCfi();
                        return rendition.display(0);
                    });
                }).catch(function (err) {
                    fire("onError", ["open: " + (err && err.message ? err.message : err)]);
                });
            },

            display: function (index) {
                if (!rendition) {
                    return;
                }
                renderStart = Date.now();
                rendition.display(index).catch(function (e) {
                    fire("onError", ["jump: " + (e && e.message ? e.message : e)]);
                });
            },

            /* 带 #fragment 的目录跳转：epub.js 走 Contents.locate，能定位到同一 XHTML 内的锚点 */
            displayHref: function (href) {
                if (!rendition || !href) {
                    return;
                }
                renderStart = Date.now();
                rendition.display(href).catch(function (e) {
                    fire("onError", ["jumpHref: " + (e && e.message ? e.message : e)]);
                });
            },

            /* 存档 CFI 已失效：通知 Kotlin 侧清掉，避免坏值一直被写回 */
            forgetCfi: function () {
                startCfi = "";
                fire("onCfiInvalid", [""]);
            },

            displayCfi: function (cfi) {
                if (!rendition) {
                    return;
                }
                renderStart = Date.now();
                rendition.display(cfi).catch(function (e) {
                    fire("onError", ["jump: " + (e && e.message ? e.message : e)]);
                });
            },

            next: function () {
                if (rendition) {
                    renderStart = Date.now();
                    rendition.next();
                }
            },

            prev: function () {
                if (rendition) {
                    renderStart = Date.now();
                    rendition.prev();
                }
            },

            setFont: function (percent) {
                fontPct = percent || 100;
                if (rendition) {
                    try {
                        rendition.themes.fontSize(percent + "%");
                    } catch (e) {
                    }
                }
                applyFontSize();
            },

            setInverted: function (v) {
                inverted = !!v;
                applyTheme();
            },

            setFontFamily: function (family) {
                if (rendition && family) {
                    try {
                        rendition.themes.override("font-family", family);
                    } catch (e) {
                    }
                }
            },

            currentCfi: function () {
                if (!rendition) {
                    return "";
                }
                var loc = rendition.currentLocation();
                if (loc && loc.start) {
                    return String(loc.start.cfi || "");
                }
                return "";
            },

            destroy: function () {
                try {
                    if (book) {
                        book.destroy();
                    }
                } catch (e) {
                }
                book = null;
                rendition = null;
                inverted = false;
            }
        };

        window.onerror = function (msg) {
            fire("onError", ["js: " + msg]);
            return false;
        };
    })();
</script>
</body>
</html>
